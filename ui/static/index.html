<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Poiesis Control Panel</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Poiesis</h1>
  <div class="episode-picker">
    <span id="current-episode-path" class="current-path"></span>
    <button id="browse-episode">Choose episode…</button>
  </div>
</header>

<main id="app">
  <p id="empty-state">Click "Choose episode…" to pick a folder.</p>
</main>

<div id="browse-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <span id="browse-current-path"></span>
      <button id="browse-close" class="secondary small">Close</button>
    </div>
    <div class="modal-body" id="browse-list"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>

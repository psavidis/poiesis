<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Poiesis Control Panel</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Poiesis</h1>
  <div class="episode-picker">
    <input id="episode-path" type="text" placeholder="/path/to/episode" />
    <button id="load-episode">Load</button>
  </div>
</header>

<main id="app">
  <p id="empty-state">Enter an episode folder path above to get started.</p>
</main>

<script src="/app.js"></script>
</body>
</html>
